<div data-online-count="{{ total_online }}">
    {% for u in usuarios %}
    <div class="d-flex align-items-center justify-content-between gap-2 px-2 py-2 rounded">
        <div class="d-flex align-items-center gap-2 min-w-0">
            {% include 'chat/partials/avatar.html' with pessoa=u online=u.online mostrar_status=True %}
            <div class="min-w-0">
                <div class="small fw-semibold text-truncate">{{ u.get_full_name|default:u.username }}</div>
                <div class="small {% if u.online %}text-success{% else %}text-muted{% endif %}">{% if u.online %}Online{% else %}Offline{% endif %}</div>
            </div>
        </div>
        <form method="post" action="{% url 'chat:iniciar' u.pk %}" class="flex-shrink-0" data-iniciar-conversa>
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-primary">Conversar<span class="visually-hidden"> com {{ u.get_full_name|default:u.username }}</span></button>
        </form>
    </div>
    {% empty %}
    <p class="small text-muted text-center py-3 mb-0">Nenhum outro usuário ativo.</p>
    {% endfor %}
</div>
