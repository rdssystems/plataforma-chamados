{% comment %}
Card de gráfico do dashboard (desenhado por static/js/dashboard_graficos.js).
Parâmetros: tipo (linha | plataformas | devs | prioridades), titulo, subtitulo, recorte.
O mesmo dado vira tabela no botão "Ver tabela" (padrão: gráfico com tabela equivalente).
{% endcomment %}
<figure data-grafico="{{ tipo }}" class="card shadow-sm h-100 mb-0">
    <div class="card-body">
        <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3">
            <figcaption class="min-w-0">
                <h3 class="h6 mb-1">{{ titulo }}</h3>
                <p class="small text-muted mb-0"><span data-subtitulo>{{ subtitulo }}</span>{% if recorte %}<span class="fw-medium">{% if subtitulo %} · {% endif %}{{ recorte }}</span>{% endif %}</p>
            </figcaption>
            <button type="button" data-alternar-tabela aria-pressed="false" class="btn btn-sm btn-outline-primary flex-shrink-0">Ver tabela</button>
        </div>
        <div data-area-grafico class="grafico-area" style="height: 256px"></div>
        <div data-area-tabela class="d-none table-responsive"></div>
        <p data-estado class="d-none text-center text-muted small py-5 mb-0"></p>
    </div>
</figure>
