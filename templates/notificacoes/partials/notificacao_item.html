<div id="notif-{{ notif.pk }}" class="painel-linha{% if forloop.first %} border-top-0{% endif %}">
    <div class="d-flex gap-2">
        {% if notif.lida %}
        <i class="bi bi-circle text-muted mt-1" aria-hidden="true"></i><span class="visually-hidden">Lida:</span>
        {% else %}
        <i class="bi bi-circle-fill text-primary mt-1" aria-hidden="true"></i><span class="visually-hidden">Não lida:</span>
        {% endif %}
        <div class="min-w-0">
            <a href="{% url 'chamados:chamado_detail' notif.chamado.pk %}" class="{% if notif.lida %}text-body{% else %}fw-semibold{% endif %} text-decoration-none">{{ notif.mensagem }}</a>
            <div class="small text-muted">{{ notif.criada_em|date:"d/m/Y \à\s H:i" }} · {{ notif.chamado.codigo }}</div>
        </div>
    </div>
    <div class="d-flex flex-wrap justify-content-end gap-2">
        {% if not notif.lida %}
        <form hx-post="{% url 'notificacoes:marcar_lida' notif.pk %}" hx-target="#notif-{{ notif.pk }}" hx-swap="outerHTML"
              method="post" action="{% url 'notificacoes:marcar_lida' notif.pk %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-secondary text-nowrap">Marcar como lida</button>
        </form>
        {% endif %}
        <a href="{% url 'chamados:chamado_detail' notif.chamado.pk %}" class="btn btn-sm btn-outline-primary text-nowrap" aria-label="Abrir {{ notif.chamado.codigo }}">Abrir</a>
    </div>
</div>
