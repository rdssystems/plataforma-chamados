<div id="notif-{{ notif.pk }}" class="p-4 rounded-xl border transition flex items-center justify-between {% if notif.lida %}bg-white border-slate-200 opacity-75{% else %}bg-blue-50/50 border-blue-200 shadow-sm{% endif %}">
    <div class="flex items-center space-x-3 min-w-0">
        <span class="h-2.5 w-2.5 rounded-full flex-shrink-0 {% if not notif.lida %}bg-blue-600 ring-4 ring-blue-100{% else %}bg-slate-300{% endif %}"></span>
        <div class="min-w-0">
            <p class="text-sm font-medium text-slate-800">
                <a href="{% url 'chamados:chamado_detail' notif.chamado.pk %}" class="hover:underline">
                    {{ notif.mensagem }}
                </a>
            </p>
            <p class="text-xs text-slate-400 mt-0.5">
                {{ notif.criada_em|date:"d/m/Y \à\s H:i" }} &bull; Chamado: <span class="font-semibold text-slate-600">{{ notif.chamado.codigo }}</span>
            </p>
        </div>
    </div>
    <div class="flex items-center space-x-2 flex-shrink-0 ml-4">
        <a href="{% url 'chamados:chamado_detail' notif.chamado.pk %}" class="text-xs font-semibold text-blue-600 hover:text-blue-800">
            Acessar &rarr;
        </a>
        {% if not notif.lida %}
        <form hx-post="{% url 'notificacoes:marcar_lida' notif.pk %}"
              hx-target="#notif-{{ notif.pk }}"
              hx-swap="outerHTML"
              class="inline">
            {% csrf_token %}
            <button type="submit" class="text-xs font-medium text-slate-500 hover:text-slate-800 px-2 py-1 rounded bg-slate-100 hover:bg-slate-200 transition">
                Marcar como lida
            </button>
        </form>
        {% endif %}
    </div>
</div>
